<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Спайк: clip-path на композиторе?</title>
<style>
  /* Временный стенд (гейт 0 плана морфа чат ↔ Все чаты). Удалить после замера.
     Вопрос: гонит ли WebKit переход `clip-path: inset(... round ...)` на композиторе
     вместе с `transform`. Проверка: во время перехода главный поток блокируется на 1500 мс
     (счётчик rAF замирает). Если слой продолжает обрезаться синхронно с движением —
     clip-path композитится; если геометрия едет, а обрезка стоит — нет. */
  html, body { margin: 0; height: 100%; background: #e9eef5; font: 16px/1.3 -apple-system, system-ui, sans-serif; overflow: hidden; }
  .stage { position: fixed; inset: 0; }
  .layer {
    position: absolute; left: 0; top: 0; width: 100%; height: 100%;
    transform-origin: 0 0;
    will-change: transform, clip-path;
    clip-path: inset(0 round 22px);
    transform: none;
    transition: transform 2000ms linear, clip-path 2000ms linear;
    background:
      repeating-linear-gradient(0deg, #1e63d6 0 40px, #4f8cf0 40px 80px);
  }
  .layer.is-target {
    transform: translate(20px, 120px) scale(0.903);
    clip-path: inset(0 0 var(--cut, 700px) 0 round 22px);
  }
  .row { position: absolute; left: 20px; top: 120px; width: calc(100% - 40px); height: 74px; border-radius: 20px; background: #cfd8e6; }
  .hud { position: fixed; left: 12px; bottom: 12px; padding: 8px 12px; border-radius: 10px; background: rgba(0,0,0,.75); color: #fff; font-variant-numeric: tabular-nums; z-index: 2; }
  .hud b { color: #ffd166; }
  button { position: fixed; right: 12px; bottom: 12px; padding: 12px 16px; border: 0; border-radius: 12px; background: #111; color: #fff; font: inherit; z-index: 2; }
</style>
</head>
<body>
<div class="stage">
  <div class="row"></div>
  <div class="layer" id="layer"></div>
</div>
<div class="hud">rAF: <b id="raf">0</b> · фаза: <b id="phase">ожидание</b></div>
<button id="go" type="button">Старт</button>
<script>
  const layer = document.getElementById('layer');
  const rafEl = document.getElementById('raf');
  const phaseEl = document.getElementById('phase');
  let ticks = 0;
  (function loop() { ticks++; rafEl.textContent = String(ticks); requestAnimationFrame(loop); })();

  // Низ обрезки: экран − 74 / 0.903 (в локальных координатах слоя).
  const cut = window.innerHeight - 74 / 0.903;
  layer.style.setProperty('--cut', cut + 'px');

  function run() {
    layer.classList.remove('is-target');
    void layer.offsetWidth;
    phaseEl.textContent = 'переход';
    layer.classList.add('is-target');
    // Через 300 мс (переход уже закоммичен) блокируем главный поток на 1500 мс:
    // переход 2000 мс: 300 → 1800 мс идёт «вслепую», последние 200 мс — с живым main thread.
    setTimeout(() => {
      phaseEl.textContent = 'БЛОК main thread';
      const until = performance.now() + 1500;
      while (performance.now() < until) { /* busy */ }
      phaseEl.textContent = 'блок снят';
    }, 300);
  }
  document.getElementById('go').addEventListener('click', run);
  if (new URLSearchParams(location.search).has('auto')) setTimeout(run, 800);
</script>
</body>
</html>
