    <!-- standalone-режим с домашнего экрана: прототип открывается без хрома браузера -->
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" type="image/png" href="icon-192.png" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- black-translucent, а не default: только так вебвью в standalone занимает и зону
         статус-бара (env(safe-area-inset-top) начинает отдавать её высоту), и под статус-бар
         уходит синий фон страницы. Заодно текст статус-бара становится белым. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <!-- тулбар Safari и системный хром Android — в синий верх градиента (Bg_Light) -->
    <meta name="theme-color" content="#1c85fe" />
