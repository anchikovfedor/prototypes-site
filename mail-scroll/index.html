<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover обязателен: без него iOS вписывает вебвью в safe area — контент
         не уходит под статус-бар, env(safe-area-inset-*) отдаёт 0, а зону статус-бара
         заливает фон окна (проверено на устройстве 2026-08-05). -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- standalone-режим с домашнего экрана: прототип открывается без хрома браузера -->
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" type="image/png" href="icon-192.png" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- black-translucent, а не default: только так вебвью в standalone занимает и зону
         статус-бара (env(safe-area-inset-top) начинает отдавать её высоту), и контент уходит
         под неё. Заодно текст статус-бара становится белым. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <!-- theme-color намеренно нет (2026-08-05): в standalone iOS красит им зону статус-бара,
         и поверх контента оставалась синяя полоса — она перебивает black-translucent.
         Цена: в Safari с тулбарами верхняя полоса браузера теперь дефолтная, а не синяя. -->
    <title>Prototype — mail-scroll</title>
    <script type="module" crossorigin src="/prototypes-site/mail-scroll/assets/index-CO6r7Y4r.js"></script>
    <link rel="stylesheet" crossorigin href="/prototypes-site/mail-scroll/assets/index-B8U6j4lW.css">
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
