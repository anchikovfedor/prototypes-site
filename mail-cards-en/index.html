<html lang="en">

    <!-- standalone-режим с домашнего экрана: прототип открывается без хрома браузера -->
    <link rel="manifest" href="manifest.webmanifest" />
    <!-- favicon — со скруглениями и прозрачными углами (для табов); icon-*/apple-touch-icon —
         квадратные, их скругляют iOS и WebAPK сами. Оба набора — узел beta из Figma -->
    <link rel="icon" type="image/png" href="favicon.png" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- default сохраняет высоту PWA до нижнего края экрана; black-translucent
         на iOS 26 может укорачивать viewport на высоту статус-бара. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="theme-color" content="#1c85fe" />
